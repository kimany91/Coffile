<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A4E34"/>
      <stop offset="0.55" stop-color="#5A3824"/>
      <stop offset="1" stop-color="#3A2316"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF5EA"/>
      <stop offset="1" stop-color="#EFE4D2"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2D4BD"/>
      <stop offset="1" stop-color="#CDBB9F"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5A36"/>
      <stop offset="0.6" stop-color="#5B3420"/>
      <stop offset="1" stop-color="#3E2213"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#1E0F07" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="220" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="220" fill="url(#shine)"/>

  <g transform="translate(-14 48)">
    <!-- vapeur -->
    <g fill="none" stroke="#F4EBDD" stroke-linecap="round" stroke-width="26" opacity="0.9">
      <path d="M430 250c-30-34 30-58 0-96"/>
      <path d="M500 232c-34-40 34-66 0-112"/>
      <path d="M570 250c-30-34 30-58 0-96"/>
    </g>
    <g filter="url(#sh)">
      <!-- anse (en cube, sur la face droite) -->
      <path d="M582 470 L742 562 L742 712 L582 620" fill="none" stroke="#E4D6C0" stroke-width="46" stroke-linejoin="round"/>
      <!-- faces du cube -->
      <polygon points="280,385 480,500 480,790 280,675" fill="url(#left)"/>
      <polygon points="480,500 680,385 680,675 480,790" fill="url(#right)"/>
      <polygon points="480,270 680,385 480,500 280,385" fill="#F7EFE2"/>
      <!-- café -->
      <polygon points="480,296 634,385 480,474 326,385" fill="url(#coffee)"/>
      <!-- crème -->
      <polygon points="480,338 560,385 480,432 400,385" fill="#A6744C" opacity="0.55"/>
      <path d="M480 290 L640 382" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- arêtes -->
    <path d="M480 500 L480 790" stroke="#B8A383" stroke-width="5"/>
  </g>
</svg>
